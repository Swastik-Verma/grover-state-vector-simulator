name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build

      - name: Run basic tests
        run: ./build/test_basic

      - name: Run correctness tests
        run: ./build/test_correctness

      - name: Run optimized gates tests
        run: ./build/test_optimized_gates

      - name: Run Day 5 tests
        run: ./build/test_day5_optimized